<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>주님 다시 오실때까지</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@500;900&display=swap" rel="stylesheet">
<style>
  :root {
    --fill: #ffd54a;        /* 부른 글자 색 */
    --base: #ffffff;        /* 아직 안 부른 글자 색 */
    --dim: rgba(255,255,255,.38);
    --panel: rgba(10,12,20,.72);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #05060a; color: #fff;
    font-family: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; overflow: hidden; }

  /* ---------- 슬라이드 ---------- */
  .stage { position: fixed; inset: 0; }
  .slide { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: center;
    align-items: center; padding: 6vh 6vw 16vh; opacity: 0; transition: opacity .9s ease; }
  .slide.active { opacity: 1; }
  .slide .bg { position: absolute; inset: 0; z-index: -1; }
  .slide .tag { position: absolute; top: 4vh; left: 50%; transform: translateX(-50%); font-size: clamp(12px, 1.6vw, 18px);
    letter-spacing: .3em; color: rgba(255,255,255,.55); white-space: nowrap; }

  /* 1. 좁은 길 – 새벽 언덕 위 십자가 */
  #s1 .bg { background:
      radial-gradient(ellipse at 50% 105%, rgba(255,190,110,.55), transparent 55%),
      linear-gradient(#0b1530 0%, #23305a 45%, #8a5a62 80%, #e3a26f 100%); }
  /* 2. 일어나 달려 – 떠오르는 해 */
  #s2 .bg { background:
      radial-gradient(circle at 50% 78%, #fff3c4 0, #ffc861 8%, rgba(255,140,60,.6) 22%, transparent 48%),
      linear-gradient(#18234d 0%, #4a3b7a 40%, #c0607a 72%, #f5a25b 100%); }
  /* 3. 사모하는 주님 – 온 땅을 덮는 영광의 빛 */
  #s3 .bg { background:
      repeating-conic-gradient(from 0deg at 50% 0%, rgba(255,235,170,.10) 0deg 6deg, transparent 6deg 14deg),
      radial-gradient(ellipse at 50% 0%, rgba(255,240,190,.75), transparent 60%),
      linear-gradient(#5a3d12 0%, #2a1f3d 55%, #0d1022 100%); }
  /* 4. 영광의 왕 – 왕관과 금빛 */
  #s4 .bg { background:
      radial-gradient(circle at 50% 42%, rgba(255,215,120,.55), transparent 45%),
      radial-gradient(circle at 20% 80%, rgba(170,60,90,.5), transparent 40%),
      radial-gradient(circle at 80% 80%, rgba(80,50,150,.5), transparent 40%),
      linear-gradient(#1a0d22, #2b1236 60%, #0c0610); }
  .art { position: absolute; left: 50%; transform: translateX(-50%); z-index: -1; opacity: .5; pointer-events: none; }
  #s1 .art { bottom: 14vh; width: min(22vh, 30vw); }
  #s4 .art { top: 9vh; width: min(20vh, 28vw); opacity: .55; }

  .lines { display: flex; flex-direction: column; gap: 2.4vh; align-items: center; text-align: center; max-width: 1400px;
    filter: drop-shadow(0 3px 6px rgba(0,0,0,.85)); }
  .line { font-weight: 900; font-size: clamp(24px, 5.2vw, 76px); line-height: 1.25; word-break: keep-all; }
  .line span {
    --p: 0%;
    color: transparent;
    -webkit-background-clip: text; background-clip: text;
    background-image: linear-gradient(90deg, var(--fill) 0, var(--fill) var(--p), var(--base) var(--p), var(--base) 100%);
    -webkit-text-stroke: 1px rgba(0,0,0,.35);
  }
  .line.sung span { --p: 100%; }
  .line.waiting span { background-image: linear-gradient(var(--dim), var(--dim)); }
  .line.now { transform: scale(1.04); transition: transform .3s; }

  /* ---------- 시작 화면 / 조작부 ---------- */
  .intro { position: fixed; inset: 0; z-index: 30; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 18px; padding: 16px; text-align: center; background: radial-gradient(ellipse at 50% 30%, #2a2f55, #07080f 70%); }
  .intro h1 { margin: 0; font-size: clamp(30px, 6vw, 64px); font-weight: 900; }
  .intro p { margin: 0; color: #c9cbe0; max-width: 560px; line-height: 1.6; font-size: 15px; }
  .intro .row { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
  button, .filebtn { font: inherit; font-size: 15px; font-weight: 500; color: #fff; background: #3a4384; border: 1px solid #5a64b0;
    border-radius: 10px; padding: 10px 16px; cursor: pointer; }
  button.primary { background: #e0a91c; border-color: #ffd54a; color: #1a1300; font-weight: 900; font-size: 18px; padding: 14px 26px; }
  button:hover, .filebtn:hover { filter: brightness(1.15); }
  .filebtn input { display: none; }

  .bar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    padding: 10px 16px; background: var(--panel); backdrop-filter: blur(6px); transition: opacity .4s; }
  body.idle .bar { opacity: 0; }
  .bar button { padding: 6px 12px; font-size: 14px; }
  .bar .time { font-variant-numeric: tabular-nums; font-size: 13px; color: #c9cbe0; min-width: 92px; }
  .bar input[type=range] { flex: 1; min-width: 120px; accent-color: var(--fill); }
  .bar .dots { display: flex; gap: 6px; }
  .bar .dots i { width: 9px; height: 9px; border-radius: 50%; background: rgba(255,255,255,.3); }
  .bar .dots i.on { background: var(--fill); }

  /* 유튜브 플레이어: 소리만 쓰므로 화면 구석에 작게 */
  #ytwrap { position: fixed; right: 12px; top: 12px; z-index: 25; width: 200px; aspect-ratio: 16/9; border-radius: 8px;
    overflow: hidden; box-shadow: 0 4px 18px rgba(0,0,0,.6); transition: opacity .4s; }
  #ytwrap.hidden { opacity: 0; pointer-events: none; }
  #ytwrap iframe, #ytwrap > div { width: 100%; height: 100%; }

  /* 타이밍 기록 */
  .rec { position: fixed; left: 50%; top: 12px; transform: translateX(-50%); z-index: 26; background: #a3122a; color: #fff;
    padding: 8px 16px; border-radius: 10px; font-size: 14px; display: none; text-align: center; max-width: calc(100% - 32px); }
  body.recording .rec { display: block; }
  .out { position: fixed; inset: 0; z-index: 40; display: none; align-items: center; justify-content: center; background: rgba(0,0,0,.75); padding: 16px; }
  .out.show { display: flex; }
  .out .box { background: #151829; border-radius: 14px; padding: 18px; width: min(640px, 100%); }
  .out textarea { width: 100%; height: 220px; font: 13px/1.5 ui-monospace, Menlo, monospace; background: #0b0d18; color: #e8e8f0;
    border: 1px solid #333a66; border-radius: 8px; padding: 10px; }
  .out p { color: #c9cbe0; font-size: 14px; line-height: 1.6; margin: 0 0 10px; }
</style>
</head>
<body>

<!-- ===== 슬라이드 4장 ===== -->
<div class="stage" id="stage">
  <section class="slide" id="s1">
    <div class="bg"></div>
    <svg class="art" viewBox="0 0 100 140" aria-hidden="true">
      <rect x="44" y="0" width="12" height="140" fill="#0b0b12"/><rect x="18" y="30" width="64" height="11" fill="#0b0b12"/>
    </svg>
    <div class="tag">좁은 문 · 좁은 길</div>
    <div class="lines"></div>
  </section>
  <section class="slide" id="s2">
    <div class="bg"></div>
    <div class="tag">일어나 달려가리라</div>
    <div class="lines"></div>
  </section>
  <section class="slide" id="s3">
    <div class="bg"></div>
    <div class="tag">내 사모하는 주님</div>
    <div class="lines"></div>
  </section>
  <section class="slide" id="s4">
    <div class="bg"></div>
    <svg class="art" viewBox="0 0 120 80" aria-hidden="true">
      <path d="M8 70 L14 20 L38 45 L60 6 L82 45 L106 20 L112 70 Z" fill="#ffd54a"/>
      <rect x="8" y="66" width="104" height="10" rx="3" fill="#e0a91c"/>
    </svg>
    <div class="tag">영광의 왕</div>
    <div class="lines"></div>
  </section>
</div>

<div id="ytwrap"><div id="yt"></div></div>
<audio id="audio" preload="auto"></audio>

<!-- ===== 시작 화면 ===== -->
<div class="intro" id="intro">
  <h1>주님 다시 오실때까지</h1>
  <p>원곡 유튜브 소리에 맞춰 가사가 노래방처럼 채워집니다.<br>
     유튜브가 막힌 곳에서는 mp3 파일을 골라서 쓰세요.</p>
  <div class="row"><button class="primary" id="startYt">▶ 유튜브 원곡으로 시작</button></div>
  <div class="row">
    <label class="filebtn">🎵 mp3 파일 고르기<input type="file" id="pick" accept="audio/*"></label>
    <button id="startDemo">소리 없이 미리보기</button>
  </div>
  <p style="font-size:13px;color:#8d90ad">단축키: 스페이스 재생/멈춤 · ←/→ 5초 이동 · F 전체화면 · V 유튜브 창 숨기기 · R 타이밍 기록</p>
</div>

<!-- ===== 조작부 ===== -->
<div class="bar" id="bar">
  <button id="play">⏯</button>
  <span class="time" id="time">0:00 / 0:00</span>
  <input type="range" id="seek" min="0" max="1000" value="0" step="1">
  <span class="dots" id="dots"><i></i><i></i><i></i><i></i></span>
  <button id="video" title="V">유튜브 창</button>
  <button id="recBtn" title="R">타이밍 기록</button>
  <button id="full" title="F">전체화면</button>
</div>

<div class="rec" id="rec"></div>
<div class="out" id="out"><div class="box">
  <p>기록이 끝났습니다. 이 브라우저에는 바로 적용되었습니다.<br>
     모든 컴퓨터에 쓰려면 아래 내용을 <b>index.html</b>의 <code>TIMES</code> 배열에 붙여넣으세요.</p>
  <textarea id="outText" readonly></textarea>
  <div class="row" style="display:flex;gap:10px;margin-top:10px;flex-wrap:wrap">
    <button id="copy">복사</button><button id="resetRec">기록 지우고 기본값으로</button><button id="closeOut">닫기</button>
  </div>
</div></div>

<script src="https://www.youtube.com/iframe_api" async></script>
<script>
/* =====================================================================
   ★ 여기만 고치면 됩니다 ★
   ===================================================================== */

const YOUTUBE_ID = "J38CAbOz8pc";   // 원곡 유튜브 영상

// 슬라이드 4장의 가사 (슬라이드 번호 1~4, 줄 번호 1부터)
const SLIDES = [
  [ "주님 다시 오실때까지 나는 이 길을 가리라",
    "좁은문 좁은길 나의 십자가 지고",
    "나의 가는 이 길 끝에서 나는 주님을 보리라",
    "영광의 내 주님 나를 맞아 주시리" ],
  [ "주님 다시 오실때까지 나는 일어나 달려 가리라",
    "주의 영광 온땅 덮을때 나는 일어나 노래하리" ],
  [ "내 사모하는 주님 온세상 구주시라",
    "내 사모하는 주님 영광의 왕이시라" ],
  [ "내 사모하는 주님 온세상 구주시라",
    "내 사모하는 주님 영광의 왕이시라",
    "영광의 왕이시라",
    "영광의 왕이시라" ],
];

// 노래 순서와 타이밍 (한 줄 = 가사 한 줄)
//   [시작 초, 슬라이드, 줄]  — 시작 초는 음원에서 그 줄을 부르기 시작하는 시각입니다.
//   글자는 시작 초부터 다음 줄 시작 직전까지 채워집니다.
//   맞지 않으면 숫자만 고치거나, 화면에서 [타이밍 기록] 버튼으로 직접 맞추세요.
const TIMES = [
  [ 17.0, 1, 1 ],   // 주님 다시 오실때까지 나는 이 길을 가리라
  [ 25.0, 1, 2 ],   // 좁은문 좁은길 나의 십자가 지고
  [ 33.0, 1, 3 ],   // 나의 가는 이 길 끝에서 나는 주님을 보리라
  [ 41.0, 1, 4 ],   // 영광의 내 주님 나를 맞아 주시리
  [ 49.0, 2, 1 ],   // 주님 다시 오실때까지 나는 일어나 달려 가리라
  [ 57.0, 2, 2 ],   // 주의 영광 온땅 덮을때 나는 일어나 노래하리
  [ 65.0, 3, 1 ],   // 내 사모하는 주님 온세상 구주시라
  [ 73.0, 3, 2 ],   // 내 사모하는 주님 영광의 왕이시라
  [ 89.0, 1, 1 ],   // (2절) 주님 다시 오실때까지 나는 이 길을 가리라
  [ 97.0, 1, 2 ],   // 좁은문 좁은길 나의 십자가 지고
  [105.0, 1, 3 ],   // 나의 가는 이 길 끝에서 나는 주님을 보리라
  [113.0, 1, 4 ],   // 영광의 내 주님 나를 맞아 주시리
  [121.0, 2, 1 ],   // 주님 다시 오실때까지 나는 일어나 달려 가리라
  [129.0, 2, 2 ],   // 주의 영광 온땅 덮을때 나는 일어나 노래하리
  [137.0, 3, 1 ],   // 내 사모하는 주님 온세상 구주시라
  [145.0, 3, 2 ],   // 내 사모하는 주님 영광의 왕이시라
  [153.0, 3, 1 ],   // 내 사모하는 주님 온세상 구주시라
  [161.0, 3, 2 ],   // 내 사모하는 주님 영광의 왕이시라
  [169.0, 4, 1 ],   // 내 사모하는 주님 온세상 구주시라
  [177.0, 4, 2 ],   // 내 사모하는 주님 영광의 왕이시라
  [185.0, 4, 3 ],   // 영광의 왕이시라
  [191.0, 4, 4 ],   // 영광의 왕이시라
];
const LAST_LINE_SECONDS = 7;   // 마지막 줄이 채워지는 시간
const MAX_LINE_SECONDS  = 10;  // 간주가 길어도 한 줄은 이 시간 안에 다 채움
const LEAD_IN = 3;             // 다음 슬라이드를 미리 보여주는 시간(초)

/* ===================================================================== */

const $ = s => document.querySelector(s);
const slidesEl = [...document.querySelectorAll(".slide")];
const STORE_KEY = "until-he-comes-times";

// 저장된 기록이 있으면 그것을 씀
let times = TIMES.map(r => r.slice());
try {
  const saved = JSON.parse(localStorage.getItem(STORE_KEY) || "null");
  if (Array.isArray(saved) && saved.length === TIMES.length) saved.forEach((t, i) => times[i][0] = t);
} catch (e) {}

// 가사 그리기
const lineEls = SLIDES.map((lines, si) => {
  const box = slidesEl[si].querySelector(".lines");
  return lines.map(text => {
    const d = document.createElement("div");
    d.className = "line waiting";
    const s = document.createElement("span");
    s.textContent = text;
    d.appendChild(s); box.appendChild(d);
    return d;
  });
});

/* ---------- 재생기: 유튜브 / mp3 / 소리없음 ---------- */
let mode = null, yt = null, ytReady = false;
const audio = $("#audio");
const demo = { t: 0, playing: false, last: 0, dur: 210 };

const player = {
  time() {
    if (mode === "yt" && ytReady) return yt.getCurrentTime() || 0;
    if (mode === "file") return audio.currentTime || 0;
    return demo.t;
  },
  duration() {
    if (mode === "yt" && ytReady) return yt.getDuration() || 0;
    if (mode === "file") return audio.duration || 0;
    return demo.dur;
  },
  playing() {
    if (mode === "yt" && ytReady) return yt.getPlayerState() === 1;
    if (mode === "file") return !audio.paused;
    return demo.playing;
  },
  play() {
    if (mode === "yt" && ytReady) yt.playVideo();
    else if (mode === "file") audio.play();
    else { demo.playing = true; demo.last = performance.now(); }
  },
  pause() {
    if (mode === "yt" && ytReady) yt.pauseVideo();
    else if (mode === "file") audio.pause();
    else demo.playing = false;
  },
  seek(t) {
    t = Math.max(0, t);
    if (mode === "yt" && ytReady) yt.seekTo(t, true);
    else if (mode === "file") audio.currentTime = t;
    else demo.t = t;
  },
  toggle() { this.playing() ? this.pause() : this.play(); },
};

window.onYouTubeIframeAPIReady = () => {
  yt = new YT.Player("yt", {
    videoId: YOUTUBE_ID,
    playerVars: { playsinline: 1, rel: 0, modestbranding: 1, controls: 1 },
    events: { onReady: () => { ytReady = true; if (mode === "yt") yt.playVideo(); } },
  });
};

function start(m) {
  mode = m;
  $("#intro").style.display = "none";
  $("#ytwrap").classList.toggle("hidden", m !== "yt");
  $("#video").style.display = m === "yt" ? "" : "none";
  if (m === "yt" && !ytReady && !window.YT) {
    alert("유튜브를 불러오지 못했습니다. 인터넷 연결을 확인하거나 mp3 파일을 골라 주세요.");
  }
  player.play();
}
$("#startYt").onclick = () => start("yt");
$("#startDemo").onclick = () => start("demo");
$("#pick").onchange = e => {
  const f = e.target.files[0]; if (!f) return;
  audio.src = URL.createObjectURL(f);
  start("file");
};

/* ---------- 화면 갱신 ---------- */
function lineEnd(i) {
  const next = times[i + 1] ? times[i + 1][0] : times[i][0] + LAST_LINE_SECONDS;
  return Math.min(next, times[i][0] + MAX_LINE_SECONDS);
}

let shownSlide = -1;
function render() {
  if (mode === "demo" && demo.playing) {
    const now = performance.now();
    demo.t = Math.min(demo.dur, demo.t + (now - demo.last) / 1000); demo.last = now;
    if (demo.t >= demo.dur) demo.playing = false;
  }
  const t = player.time();

  // 지금 부르는 줄 (없으면 직전 줄)
  let cur = -1;
  for (let i = 0; i < times.length; i++) if (t >= times[i][0]) cur = i;
  // 다음 줄이 새 슬라이드면 LEAD_IN 초 먼저 넘김
  let slideIdx = cur >= 0 ? times[cur][1] - 1 : 0;
  const nxt = times[cur + 1];
  if (nxt && nxt[1] - 1 !== slideIdx && t >= nxt[0] - LEAD_IN && (cur < 0 || t >= lineEnd(cur))) slideIdx = nxt[1] - 1;

  if (slideIdx !== shownSlide) {
    slidesEl.forEach((s, i) => s.classList.toggle("active", i === slideIdx));
    document.querySelectorAll("#dots i").forEach((d, i) => d.classList.toggle("on", i === slideIdx));
    shownSlide = slideIdx;
  }

  // 이번 슬라이드 "회차"의 첫 줄 찾기 (반복되는 슬라이드도 처음부터 다시 채움)
  let runStart = cur;
  if (cur < 0 || times[cur][1] - 1 !== slideIdx) runStart = cur + 1;
  else while (runStart > 0 && times[runStart - 1][1] - 1 === slideIdx && times[runStart - 1][2] < times[runStart][2]) runStart--;

  lineEls[slideIdx].forEach((el, li) => {
    // 이 슬라이드 회차에서 이 줄의 타이밍 찾기
    let p = 0, idx = -1;
    for (let i = runStart; i < times.length && times[i][1] - 1 === slideIdx; i++) {
      if (times[i][2] - 1 === li) { idx = i; break; }
      if (i > runStart && times[i][2] <= times[i - 1][2]) break;
    }
    if (idx >= 0 && t >= times[idx][0]) {
      p = Math.min(1, (t - times[idx][0]) / (lineEnd(idx) - times[idx][0]));
    }
    el.classList.toggle("waiting", idx >= 0 && t < times[idx][0]);
    el.classList.toggle("now", idx === cur && p < 1);
    el.classList.remove("sung");
    el.firstChild.style.setProperty("--p", (p * 100).toFixed(2) + "%");
  });

  // 조작부
  const d = player.duration();
  $("#time").textContent = fmt(t) + " / " + fmt(d);
  if (!seeking && d) $("#seek").value = Math.round((t / d) * 1000);

  requestAnimationFrame(render);
}
const fmt = s => (s = Math.floor(s || 0), Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0"));
requestAnimationFrame(render);

/* ---------- 조작 ---------- */
let seeking = false;
const seekEl = $("#seek");
seekEl.oninput = () => { seeking = true; };
seekEl.onchange = () => { player.seek(seekEl.value / 1000 * player.duration()); seeking = false; };
$("#play").onclick = () => player.toggle();
$("#full").onclick = toggleFull;
$("#video").onclick = () => $("#ytwrap").classList.toggle("hidden");
function toggleFull() {
  if (document.fullscreenElement) document.exitFullscreen();
  else document.documentElement.requestFullscreen?.();
}

// 마우스를 3초 안 움직이면 조작부 숨김
let idleTimer;
function wake() { document.body.classList.remove("idle"); clearTimeout(idleTimer);
  idleTimer = setTimeout(() => mode && document.body.classList.add("idle"), 3000); }
["mousemove", "touchstart", "keydown"].forEach(e => addEventListener(e, wake));

/* ---------- 타이밍 기록 ---------- */
// 기록 중에는 각 줄을 부르기 시작할 때마다 스페이스(또는 화면 터치)를 누릅니다.
let rec = null;
function startRec() {
  if (!mode) return;
  rec = [];
  document.body.classList.add("recording");
  player.seek(0); player.play();
  showRecHint();
}
function showRecHint() {
  const i = rec.length;
  const r = times[i];
  $("#rec").innerHTML = "● 타이밍 기록 중 (" + (i + 1) + "/" + times.length + ") — 이 줄을 부르기 시작할 때 <b>스페이스</b> 또는 화면 터치<br>“" +
    SLIDES[r[1] - 1][r[2] - 1] + "” · Esc 취소";
}
function tap() {
  rec.push(Math.round(player.time() * 10) / 10);
  if (rec.length < times.length) return showRecHint();
  rec.forEach((t, i) => times[i][0] = t);
  try { localStorage.setItem(STORE_KEY, JSON.stringify(rec)); } catch (e) {}
  document.body.classList.remove("recording");
  $("#outText").value = "const TIMES = [\n" + times.map(r =>
    "  [" + r[0].toFixed(1).padStart(5) + ", " + r[1] + ", " + r[2] + " ],   // " + SLIDES[r[1] - 1][r[2] - 1]).join("\n") + "\n];";
  $("#out").classList.add("show");
  rec = null;
}
function cancelRec() { rec = null; document.body.classList.remove("recording"); }
$("#recBtn").onclick = e => { e.currentTarget.blur(); startRec(); };
$("#stage").addEventListener("click", () => { if (rec) tap(); });
$("#copy").onclick = () => { $("#outText").select(); navigator.clipboard?.writeText($("#outText").value); };
$("#closeOut").onclick = () => $("#out").classList.remove("show");
$("#resetRec").onclick = () => {
  try { localStorage.removeItem(STORE_KEY); } catch (e) {}
  times = TIMES.map(r => r.slice());
  $("#out").classList.remove("show");
};

addEventListener("keydown", e => {
  if (!mode || e.target.tagName === "TEXTAREA") return;
  if (e.code === "Space" || e.code === "Enter") { e.preventDefault(); rec ? tap() : player.toggle(); }
  else if (e.code === "Escape" && rec) cancelRec();
  else if (e.code === "ArrowRight") player.seek(player.time() + 5);
  else if (e.code === "ArrowLeft") player.seek(player.time() - 5);
  else if (e.key === "f" || e.key === "F") toggleFull();
  else if ((e.key === "v" || e.key === "V") && mode === "yt") $("#ytwrap").classList.toggle("hidden");
  else if ((e.key === "r" || e.key === "R") && !rec) startRec();
});
</script>
</body>
