<!doctype html>
<html lang="km">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ដំណឹងល្អ — Motion Reel</title>
<style>
@font-face{font-family:'KHD';src:url(fonts/Koulen-400.ttf)}
@font-face{font-family:'KHS';src:url(fonts/Battambang-700.ttf);font-weight:100 900}
@font-face{font-family:'KH';src:url(fonts/NotoSansKhmer-400.ttf);font-weight:400}
@font-face{font-family:'KH';src:url(fonts/NotoSansKhmer-700.ttf);font-weight:700}
@font-face{font-family:'BHS';src:url(fonts/BlackHanSans-400.ttf)}
@font-face{font-family:'MJ';src:url(fonts/NanumMyeongjo-800.ttf)}
@font-face{font-family:'MONO';src:url(fonts/NanumGothicCoding-400.ttf);font-weight:400}
@font-face{font-family:'MONO';src:url(fonts/NanumGothicCoding-700.ttf);font-weight:700}
html,body{margin:0;height:100%;background:#000;overflow:hidden}
body{display:flex;align-items:center;justify-content:center}
canvas{width:100vw;max-width:calc(100vh*16/9);aspect-ratio:16/9;display:block;background:#000}
#play{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.55);
  color:#ffcf6b;font:700 28px KH,MONO,monospace;letter-spacing:.2em;cursor:pointer;border:0}
body.render #play{display:none}
</style>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<button id="play">▶ PLAY — ដំណឹងល្អ</button>
<audio id="music" src="music.mp3" preload="auto"></audio>
<script>
// ───────────────────────── core ─────────────────────────
const W=1920,H=1080,DUR=30;
const B0=0.09,BEAT=0.375,BAR=1.5;           // 160 BPM, downbeat phase measured from the track
const T2=B0+4*BAR,T3=B0+8*BAR,T4=B0+12*BAR,T5=B0+16*BAR; // scene cuts on downbeats
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const GOLD='#ffcf6b',RED='#ff3045',INK='#05060a';

const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const lerp=(a,b,t)=>a+(b-a)*t;
const inv=(a,b,x)=>clamp((x-a)/(b-a));
const eOutExpo=t=>t>=1?1:1-Math.pow(2,-10*t);
const eOutCubic=t=>1-Math.pow(1-t,3);
const eInOut=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
const eInCubic=t=>t*t*t;
const eOutBack=t=>{const c1=1.9,c3=c1+1;return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2)};
function rng(seed){return()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);
  t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const bt=k=>B0+k*BEAT;
function pulse(t,period=BEAT,decay=8){if(t<B0)return 0;return Math.exp(-((t-B0)%period)*decay)}
function mk(w=W,h=H){const c=document.createElement('canvas');c.width=w;c.height=h;return c}
function shake(t,amp){return[amp*(Math.sin(t*91.7)+Math.sin(t*53.3+1))*.5,amp*(Math.sin(t*77.1+2)+Math.sin(t*41.9))*.5]}

// ───────────────────── hangul typewriter ─────────────────────
// 한글 음절을 자모 단위로 분해해 "ㅈ → 저 → 전" 처럼 실제 타이핑되는 과정을 보여준다
const KEYS=[],BELLS=[];
const CL='ㄱㄲㄴㄷㄸㄹㅁㅂㅃㅅㅆㅇㅈㅉㅊㅋㅌㅍㅎ';
// 크메르 문자: 자음 + 받침기호(្) + 아래첨자 자음 + 모음/부호를 한 덩어리로 묶고, 코드포인트가 하나씩 쌓이며 타이핑된다
const isKhMark=c=>{const k=c.codePointAt(0);return(k>=0x17B4&&k<=0x17D3)||k===0x17DD};
function clusters(str){const out=[];let coeng=false;
  for(const c of str){if(out.length&&(coeng||isKhMark(c)))out[out.length-1]+=c;else out.push(c);coeng=c==='\u17D2'}return out}
function stages(ch){const cp=[...ch];
  if(cp.length>1){const st=[];let acc='';for(const c of cp){acc+=c;if(c!=='\u17D2')st.push(acc)}return st}
  const c=ch.charCodeAt(0)-0xAC00;if(c<0||c>11171)return[ch];
  const L=Math.floor(c/588),V=Math.floor(c%588/28),T=c%28;
  const s=[CL[L],String.fromCharCode(0xAC00+L*588+V*28)];if(T)s.push(ch);return s}
function TL(text,t0,rate,seed=1){
  const r=rng(seed*7919+text.length*31);let t=t0;
  const chars=clusters(text).map(ch=>{const c={ch,st:stages(ch),times:[],jy:(r()-.5)*6,rot:(r()-.5)*.045,ink:.8+.2*r()};
    for(let i=0;i<c.st.length;i++){c.times.push(t);if(ch!==' ')KEYS.push(t);t+=rate*(.6+.8*r())}
    if(ch===' ')t+=rate*.5;return c});
  BELLS.push(t+.04);return{text,t0,chars,end:t};
}
function caretOn(t){return((t-B0)/BEAT)%1<.55}
function drawTL(L,t,x,y,o={}){
  if(t<L.t0-(o.pre??0))return;
  ctx.save();ctx.font=o.font;ctx.textBaseline='alphabetic';ctx.textAlign='center';
  const size=parseFloat(o.font.match(/(\d+)px/)[1]);
  const ws=L.chars.map(c=>ctx.measureText(c.ch).width+(o.ls||0));
  const total=ws.reduce((a,b)=>a+b,0);
  let cx=o.align==='left'?x:x-total/2,typing=false;const a0=o.alpha??1;
  for(let i=0;i<L.chars.length;i++){
    const c=L.chars[i];let si=-1;for(let k=0;k<c.times.length;k++)if(t>=c.times[k])si=k;
    if(si<0)break;
    const age=t-c.times[si],pop=Math.exp(-age*20);
    if(c.ch!==' '){
      ctx.save();ctx.translate(cx+ws[i]/2,y+c.jy-pop*size*.14);ctx.rotate(c.rot);ctx.scale(1+pop*.3,1+pop*.3);
      ctx.globalAlpha=a0*c.ink;
      if(o.glow){ctx.shadowColor=o.glow;ctx.shadowBlur=(o.glowSize||14)+pop*36}
      ctx.fillStyle=pop>.35?(o.hot||'#fff'):o.color;ctx.fillText(c.st[si],0,0);
      // ink strike flash
      if(pop>.15&&o.strike!==false){ctx.globalCompositeOperation='lighter';ctx.globalAlpha=a0*pop*.6;ctx.fillStyle=o.glow||GOLD;
        ctx.fillRect(-ws[i]*.55,size*.12,ws[i]*1.1,2)}
      ctx.restore();
    }
    cx+=ws[i];if(age<.12)typing=true;
  }
  if(o.caret!==false&&t<L.end+(o.caretHold??1.0)&&(typing||caretOn(t))){
    ctx.globalAlpha=a0;ctx.fillStyle=o.caretColor||GOLD;ctx.shadowColor=o.caretColor||GOLD;ctx.shadowBlur=16;
    ctx.fillRect(cx+size*.08,y-size*.86,Math.max(3,size*.09),size*1.02);
  }
  ctx.restore();
}

// ───────────────────── lyrics (typed) ─────────────────────
const LY={
  a1:TL('ខ្ញុំដែលដើរក្នុងភាពងងឹត',.55,.075,1),
  a2:TL('មាននរណាម្នាក់នាំពន្លឺមកឲ្យខ្ញុំ',bt(8)+.05,.06,2),
  b1:TL('ចូរទៅគ្រប់ទាំងពិភពលោក',bt(24)+.08,.06,3),
  b2:TL('ប្រកាសដំណឹងល្អដល់មនុស្សទាំងអស់',bt(28)+.02,.05,4),
  c1:TL('ពីម្នាក់ ទៅម្នាក់ទៀត',T3+.12,.07,5),
  c2:TL('— កិច្ចការ ១:៨',bt(46)+.08,.04,6),
  d1:TL('ស្រស់ស្អាតណាស់',T4+.12,.075,7),
  d2:TL('ជើងរបស់អ្នកនាំដំណឹងល្អ',bt(52)+.05,.06,8),
  e1:TL('ថ្ងៃនេះ អ្នកគឺជាមនុស្សម្នាក់នោះ។',bt(70)+.02,.06,9),
};

// ───────────────────── shared assets ─────────────────────
const R0=rng(42);
// grain
const GR=[...Array(6)].map((_,n)=>{const c=mk(480,270),g=c.getContext('2d'),d=g.createImageData(480,270),r=rng(100+n);
  for(let i=0;i<d.data.length;i+=4){const v=r()*255;d.data[i]=d.data[i+1]=d.data[i+2]=v;d.data[i+3]=r()*70}g.putImageData(d,0,0);return c});
// vignette
const VIG=(()=>{const c=mk(),g=c.getContext('2d'),gr=g.createRadialGradient(W/2,H/2,H*.35,W/2,H/2,H*1.05);
  gr.addColorStop(0,'rgba(0,0,0,0)');gr.addColorStop(1,'rgba(0,0,0,.85)');g.fillStyle=gr;g.fillRect(0,0,W,H);return c})();
const FX=mk(),fxc=FX.getContext('2d'),CH=mk(),chc=CH.getContext('2d'),TX=mk(),txc=TX.getContext('2d');

// cross particles (scene 1 → burst into scene 2)
const CROSS={x:960,y:420};
const PN=1500,P=[...Array(PN)].map(()=>{
  let tx,ty;if(R0()<.62){tx=(R0()-.5)*76;ty=-300+R0()*600}else{tx=(R0()-.5)*400;ty=-175+R0()*72}
  const a=R0()*Math.PI*2;
  return{x:R0()*W,y:R0()*H,tx:CROSS.x+tx,ty:CROSS.y+ty,ph:R0()*6.28,sp:.3+R0(),d:R0()*.9,s:.8+R0()*2.2,
    ba:a,bv:300+R0()*1400}});

// globe points (fibonacci sphere)
const GN=2600,GP=[...Array(GN)].map((_,i)=>{const y=1-2*(i+.5)/GN,r=Math.sqrt(1-y*y),th=i*2.399963;return[Math.cos(th)*r,y,Math.sin(th)*r]});
const ll=(la,lo)=>{la*=Math.PI/180;lo*=Math.PI/180;return[Math.cos(la)*Math.sin(lo),Math.sin(la),Math.cos(la)*Math.cos(lo)]};
const ORIG=ll(37.5,127);   // 한국에서 시작
const dot=(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2];
const spread=t=>{const lt=t-T3;if(lt<0)return 0;const k=Math.floor(lt/BEAT),f=eOutExpo((lt%BEAT)/BEAT);
  return Math.PI*Math.pow(clamp((k+f)/15),1.35)};
const ARCS=(()=>{const r=rng(7),out=[];
  for(let k=0;k<16;k++)for(let j=0;j<(k<4?2:4);j++){
    const t0=T3+k*BEAT+j*.07,ang=Math.max(.05,spread(t0));let a,b,tries=0;
    do{a=GP[Math.floor(r()*GN)];tries++}while(Math.acos(clamp(dot(a,ORIG),-1,1))>ang&&tries<4000);
    if(k===0)a=ORIG;
    do{b=GP[Math.floor(r()*GN)]}while(Math.acos(clamp(dot(a,b),-1,1))<.35||Math.acos(clamp(dot(a,b),-1,1))>1.3);
    out.push({a,b,t0})}return out})();
const EMB=[...Array(520)].map(()=>({a:R0()*6.283,v:200+R0()*1300,s:.6+R0()*2.6,ph:R0()*6.28,up:20+R0()*90}));

// ───────────────────── scene 1 : darkness → light ─────────────────────
function scene1(t){
  ctx.fillStyle=INK;ctx.fillRect(0,0,W,H);
  const zoom=1+eInCubic(inv(5.4,T2,t))*1.4;
  ctx.save();ctx.translate(CROSS.x,CROSS.y);ctx.scale(zoom,zoom);ctx.translate(-CROSS.x,-CROSS.y);
  const conv=t=>eInOut(inv(2.6,5.5,t));
  const lightUp=inv(4.3,5.6,t);
  // god rays
  if(lightUp>0){ctx.save();ctx.globalCompositeOperation='lighter';ctx.translate(CROSS.x,CROSS.y);
    for(let i=0;i<28;i++){const a=i/28*6.283+t*.12,w=.035+.03*Math.sin(i*3.1);
      const g=ctx.createRadialGradient(0,0,0,0,0,1300);g.addColorStop(0,`rgba(255,207,107,${.16*lightUp*(1+pulse(t,BAR,4))})`);g.addColorStop(1,'rgba(255,207,107,0)');
      ctx.fillStyle=g;ctx.beginPath();ctx.moveTo(0,0);ctx.arc(0,0,1300,a-w,a+w);ctx.fill()}
    const g=ctx.createRadialGradient(0,0,0,0,0,600);g.addColorStop(0,`rgba(255,230,170,${.55*lightUp})`);g.addColorStop(1,'rgba(255,200,100,0)');
    ctx.fillStyle=g;ctx.fillRect(-600,-600,1200,1200);ctx.restore()}
  // heartbeat light
  const hb=pulse(t,BAR,5)*(1-lightUp);
  if(t>B0){ctx.save();ctx.globalCompositeOperation='lighter';const g=ctx.createRadialGradient(CROSS.x,CROSS.y,0,CROSS.x,CROSS.y,40+hb*160);
    g.addColorStop(0,`rgba(255,230,180,${.9*(1-lightUp*.5)})`);g.addColorStop(1,'rgba(255,190,90,0)');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);ctx.restore()}
  // particles
  ctx.save();ctx.globalCompositeOperation='lighter';
  for(const p of P){const c=conv(t-p.d*.6);
    const dx=p.x+Math.sin(t*p.sp+p.ph)*40,dy=p.y+Math.cos(t*p.sp*.7+p.ph)*30-t*8;
    const x=lerp(dx,p.tx,c),y=lerp(dy,p.ty,c);
    const tw=.35+.65*Math.abs(Math.sin(t*2*p.sp+p.ph));
    ctx.fillStyle=c>.9?`rgba(255,226,160,${.9*tw})`:`rgba(170,190,255,${(.25+.5*c)*tw})`;
    const s=p.s*(1+c*.6);ctx.fillRect(x-s/2,y-s/2,s,s)}
  ctx.restore();
  // solid cross core
  if(lightUp>0){ctx.save();ctx.globalCompositeOperation='lighter';ctx.shadowColor=GOLD;ctx.shadowBlur=60;
    ctx.fillStyle=`rgba(255,245,220,${.85*eOutCubic(lightUp)})`;ctx.fillRect(CROSS.x-30,CROSS.y-290,60,580);ctx.fillRect(CROSS.x-185,CROSS.y-160,370,52);ctx.restore()}
  ctx.restore();
  // lyrics
  const up=eOutExpo(inv(bt(8)-.2,bt(8)+.25,t));
  drawTL(LY.a1,t,960,lerp(880,800,up),{font:'700 56px KH, MONO',color:lerp(1,0,up)>0.5?'#dfe4ef':'#7d8597',glow:'rgba(150,170,255,.6)',alpha:1-up*.45,caretHold:up>0?0:9,pre:.5});
  drawTL(LY.a2,t,960,895,{font:'700 60px KH, MONO',color:'#fff3dc',glow:GOLD,glowSize:22,hot:'#ffffff'});
}

// ───────────────────── scene 2 : GO ─────────────────────
const THEMES=[{bg:'#07070a',fg:'#ffffff',row:'#ffcf6b'},{bg:'#f4f1ea',fg:'#0b0b0d',row:'#0b0b0d'},
  {bg:GOLD,fg:'#0b0b0d',row:'#0b0b0d'},{bg:'#e3172b',fg:'#ffffff',row:'#ffffff'}];
const WORDS=['ឥឡូវ','ដល់វេន','ខ្ញុំ','ប្រកាស'];
function scene2(t){
  const lt=t-T2;
  if(lt<3){
    const wi=Math.min(3,Math.floor(lt/(2*BEAT))),age=lt-wi*2*BEAT,th=THEMES[wi];
    ctx.fillStyle=th.bg;ctx.fillRect(0,0,W,H);
    // scrolling outline rows
    ctx.save();ctx.translate(W/2,H/2);ctx.rotate(-.14);ctx.font='150px KHD, BHS';ctx.lineWidth=2;ctx.strokeStyle=th.row;ctx.globalAlpha=.16;
    const row='ប្រកាស · GO · ដំណឹងល្អ · GOSPEL · ';const rw=ctx.measureText(row).width;
    for(let r=-4;r<=4;r++){const dir=r%2?1:-1,off=((dir*lt*520+r*331)%rw+rw)%rw;
      for(let x=-off-W;x<W*1.2;x+=rw)ctx.strokeText(row,x,r*160+50)}
    ctx.restore();
    // big word slam
    const sAt=a=>a<0?2.8:lerp(2.8,1,eOutExpo(a/.22))*(1+.06*Math.exp(-Math.max(0,a-BEAT)*10)*(a>BEAT?1:0));
    const [sx,sy]=shake(t,26*Math.exp(-Math.max(0,age-.18)*9)*(age>.18?1:0));
    ctx.save();ctx.translate(W/2+sx,H/2+sy+20);ctx.font='440px KHD, BHS';ctx.textAlign='center';ctx.textBaseline='middle';
    for(let j=4;j>=0;j--){const s=sAt(age-j*.022);ctx.save();ctx.scale(s,s);ctx.globalAlpha=j?.12*(5-j)/5:1;ctx.fillStyle=th.fg;ctx.fillText(WORDS[wi],0,0);ctx.restore()}
    // off-beat stamp: outline echo
    const ea=age-BEAT;if(ea>0){ctx.save();const s=1+ea*.9;ctx.scale(s,s);ctx.globalAlpha=Math.max(0,.6-ea*1.4);ctx.lineWidth=4;ctx.strokeStyle=th.fg;ctx.strokeText(WORDS[wi],0,0);ctx.restore()}
    ctx.restore();
    // index tag
    ctx.save();ctx.font='700 26px MONO, KH';ctx.fillStyle=th.fg;ctx.globalAlpha=.75;ctx.fillText(`0${wi+1} / 04`,140,H-170);ctx.fillRect(140,H-160,220*eOutExpo(age/.4),3);ctx.restore();
    // burst particles from the cross
    if(lt<1.4){ctx.save();ctx.globalCompositeOperation=wi===0?'lighter':'source-over';
      for(const p of P){const k=1-Math.exp(-lt*3.2);const x=p.tx+Math.cos(p.ba)*p.bv*k,y=p.ty+Math.sin(p.ba)*p.bv*k;
        ctx.fillStyle=`rgba(255,215,140,${(1-lt/1.4)})`;const s=p.s*1.6;ctx.fillRect(x,y,s,s)}ctx.restore()}
    return;
  }
  // split: scripture + rotating ring
  const u=lt-3;
  ctx.fillStyle='#07070a';ctx.fillRect(0,0,W,H);
  const rv=eOutExpo(u/.45);
  ctx.save();ctx.beginPath();ctx.rect(0,0,960*rv,H);ctx.clip();
  ctx.fillStyle='#0d0d12';ctx.fillRect(0,0,960,H);
  ctx.font='700 28px MONO, KH';ctx.fillStyle=GOLD;ctx.globalAlpha=inv(.2,.5,u);ctx.letterSpacing='6px';ctx.fillText('MARK 16:15  ·  ម៉ាកុស ១៦:១៥',130,360);ctx.letterSpacing='0px';
  ctx.fillRect(130,380,160*eOutExpo(inv(.2,.8,u)),3);ctx.globalAlpha=1;
  drawTL(LY.b1,t,130,500,{font:'800 58px KHS, MJ',color:'#f5f1e8',align:'left',glow:'rgba(255,207,107,.35)',caretHold:0});
  drawTL(LY.b2,t,130,610,{font:'800 58px KHS, MJ',color:GOLD,align:'left',glow:'rgba(255,207,107,.6)',hot:'#fff'});
  ctx.restore();
  // divider
  ctx.fillStyle=GOLD;ctx.fillRect(959,H/2-H/2*eOutExpo(inv(.1,.6,u)),2,H*eOutExpo(inv(.1,.6,u)));
  // ring
  const sc=eOutBack(clamp(u/.6)),cx=1440,cy=540;
  ctx.save();ctx.translate(cx,cy);ctx.scale(sc,sc);
  ringText('GO · ចូរទៅ · GOSPEL · ដំណឹងល្អ · ',330,'52px KHD, BHS',GOLD,t*.55);
  ringText('THE GOOD NEWS · សេចក្ដីអំណរ · THE GOOD NEWS · សេចក្ដីអំណរ · ',240,'700 24px MONO, KH','rgba(255,255,255,.7)',-t*.8);
  ctx.strokeStyle='rgba(255,207,107,.35)';ctx.setLineDash([4,10]);ctx.lineWidth=2;
  ctx.beginPath();ctx.arc(0,0,390,0,6.283);ctx.stroke();ctx.beginPath();ctx.arc(0,0,200,0,6.283);ctx.stroke();ctx.setLineDash([]);
  // beat tick marks orbiting
  const k=Math.floor((t-B0)/BEAT);ctx.save();ctx.rotate(k*Math.PI/8);ctx.fillStyle=RED;ctx.beginPath();ctx.arc(390,0,9,0,6.283);ctx.fill();ctx.restore();
  const p=pulse(t,BEAT,9);ctx.font='230px KHD, BHS';ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.save();ctx.scale(1+.09*p,1+.09*p);ctx.shadowColor=GOLD;ctx.shadowBlur=30+50*p;ctx.fillStyle=GOLD;ctx.fillText('GO',0,12);ctx.restore();
  ctx.restore();
}
function ringText(str,r,font,color,rot){
  ctx.save();ctx.font=font;ctx.fillStyle=color;ctx.textAlign='center';ctx.textBaseline='middle';
  const ch=clusters(str),sw=ctx.measureText(str).width,n=Math.max(1,Math.round(6.283*r/sw)),k=6.283*r/(n*sw);let a=rot;
  for(let j=0;j<n;j++)for(const c of ch){const w=ctx.measureText(c).width*k;a+=w/2/r;
    ctx.save();ctx.rotate(a);ctx.translate(0,-r);ctx.fillText(c,0,0);ctx.restore();a+=w/2/r}
  ctx.restore();
}

// ───────────────────── scene 3 : one to one → the world ─────────────────────
function proj(v,yaw,tilt,cx,cy,R){
  const x1=v[0]*Math.cos(yaw)+v[2]*Math.sin(yaw),z1=-v[0]*Math.sin(yaw)+v[2]*Math.cos(yaw);

  return[cx+R*x1,cy-R*y2,z2];
}

// ───────────────────── scene 5 : 전도 ─────────────────────

// ───────────────────── post / overlays ─────────────────────
const SCN=['DARKNESS → LIGHT','GO — ចូរទៅ','ONE TO ONE','BEAUTIFUL FEET','GOOD NEWS'];
function sceneIdx(t){return t<T2?0:t<T3?1:t<T4?2:t<T5?3:4}

  if(caretOn(t)){ctx.fillStyle=RED;ctx.beginPath();ctx.arc(m+30,m+34,7,0,6.283);ctx.fill()}ctx.fillStyle=col;
  ctx.fillText('REC   ដំណឹងល្អ · MOTION REEL',m+48,m+41);
  ctx.textAlign='right';ctx.fillText(tc(t),W-m-20,m+41);
  ctx.textAlign='left';ctx.fillText(`SCENE 0${si+1}/05 — ${SCN[si]}`,m+20,H-m-20);
  ctx.textAlign='right';ctx.fillText('160 BPM',W-m-130,H-m-20);

  ctx.restore();
}
function chroma(amt){

  ctx.save();ctx.setTransform(1,0,0,1,0,0);ctx.globalCompositeOperation='copy';ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);ctx.globalCompositeOperation='lighter';
  for(const[c,d]of[['#ff0000',-amt],['#00ff00',0],['#0000ff',amt]]){chc.globalCompositeOperation='copy';chc.drawImage(FX,0,0);chc.globalCompositeOperation='multiply';chc.fillStyle=c;chc.fillRect(0,0,W,H);ctx.drawImage(CH,d,d*.3)}
  ctx.restore();

function glitch(t,amt){
  if(amt<=.02)return;fxc.globalCompositeOperation='copy';fxc.drawImage(cv,0,0);const r=rng(Math.floor(t*60)+5);
  for(let i=0;i<Math.floor(6+amt*22);i++){const y=r()*H,h=8+r()*90*amt,dx=(r()-.5)*260*amt;ctx.drawImage(FX,0,y,W,h,dx,y,W,h)}

}
function shutter(t,b){ // horizontal blades close into the cut, then open
  const c=eInCubic(inv(b-.28,b,t)),o=eOutExpo(inv(b,b+.32,t)),n=9,hh=H/n;if(c<=0||o>=1)return;
  ctx.fillStyle='#000';for(let i=0;i<n;i++){const dir=i%2?1:-1,cov=t<b?c:1-o;const w=W*cov;ctx.fillRect(dir>0?0:W-w,i*hh,w,hh+1)}
  ctx.fillStyle=GOLD;for(let i=0;i<n;i++){const dir=i%2?1:-1,cov=t<b?c:1-o;const w=W*cov;ctx.fillRect(dir>0?w-6:W-w,i*hh,6,hh)}

function render(t){
  ctx.setTransform(1,0,0,1,0,0);ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';ctx.shadowBlur=0;
  const si=sceneIdx(t);[scene1,scene2,scene3,scene4,scene5][si](t);
  ctx.setTransform(1,0,0,1,0,0);ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';ctx.shadowBlur=0;

  const f2=Math.exp(-Math.max(0,t-T2)*7)*(t>=T2?1:0);if(f2>.01){ctx.fillStyle=`rgba(255,250,235,${f2})`;ctx.fillRect(0,0,W,H)}
  shutter(t,T3);
  if(Math.abs(t-T4)<.35)glitch(t,1-Math.abs(t-T4)/.35);
  const f5=Math.exp(-Math.max(0,t-T5)*4)*(t>=T5?1:0);if(f5>.01){ctx.fillStyle=`rgba(255,250,240,${f5})`;ctx.fillRect(0,0,W,H)}
  // chromatic punch on downbeats (scenes 2 & 5) and every scene cut
  let ca=0;if(si===1||si===4)ca=14*pulse(t,BAR,9)+5*pulse(t,BEAT,14);
  for(const b of[T2,T3,T4,T5]){const d=t-b;if(d>=0&&d<.4)ca=Math.max(ca,22*Math.exp(-d*9))}
  chroma(ca);
  ctx.drawImage(VIG,0,0);
  ctx.globalAlpha=.32;ctx.globalCompositeOperation='overlay';ctx.drawImage(GR[Math.floor(t*24)%6],0,0,W,H);ctx.globalCompositeOperation='source-over';ctx.globalAlpha=1;
  hud(t);
  // outro
  const out=inv(28.9,29.8,t);if(out>0){ctx.fillStyle=`rgba(0,0,0,${out})`;ctx.fillRect(0,0,W,H);
    if(caretOn(t)&&t<29.95){ctx.fillStyle=GOLD;ctx.shadowColor=GOLD;ctx.shadowBlur=20;ctx.fillRect(W/2-4,H/2-34,8,68);ctx.shadowBlur=0}}
  // fade-in
  const fin=1-inv(0,.35,t);if(fin>0){ctx.fillStyle=`rgba(0,0,0,${fin})`;ctx.fillRect(0,0,W,H)}
}

// ───────────────────── boot ─────────────────────
window.KEYS=KEYS;window.BELLS=BELLS;window.render=render;
window.ready=Promise.all([['400 40px KHD','ដំណឹងល្អ'],['700 40px KHS','ដំណឹងល្អ'],['400 40px KH','ដំណឹងល្អ'],['700 40px KH','ដំណឹងល្អ'],['400 40px KHD, BHS','전도GO'],['800 40px KHS, MJ','전도'],['400 40px MONO, KH','전도'],['700 40px MONO, KH','전도']].map(([f,s])=>document.fonts.load(f,s)));
const qs=new URLSearchParams(location.search);
if(qs.has('render'))document.body.classList.add('render');
window.ready.then(()=>{render(qs.has('t')?+qs.get('t'):0);
  if(qs.has('render'))return;
  const au=document.getElementById('music'),btn=document.getElementById('play');
  // 타자 효과음: 브라우저 미리보기에서도 키 소리를 합성해서 들려준다
  let ac,keyIdx=0,bellIdx=0;
  function click(at,amp){const n=ac.createBufferSource(),b=ac.createBuffer(1,ac.sampleRate*.05,ac.sampleRate),d=b.getChannelData(0);
    for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*Math.exp(-i/(ac.sampleRate*.006));n.buffer=b;
    const f=ac.createBiquadFilter();f.type='bandpass';f.frequency.value=2400+Math.random()*1600;const g=ac.createGain();g.gain.value=amp;n.connect(f).connect(g).connect(ac.destination);n.start(at)}
  function bell(at){const o=ac.createOscillator(),g=ac.createGain();o.frequency.value=2093;g.gain.setValueAtTime(.08,at);g.gain.exponentialRampToValueAtTime(.0001,at+.7);o.connect(g).connect(ac.destination);o.start(at);o.stop(at+.8)}
  const ks=[...KEYS].sort((a,b)=>a-b),bs=[...BELLS].sort((a,b)=>a-b);
  btn.onclick=()=>{ac=ac||new AudioContext();au.currentTime=0;keyIdx=0;bellIdx=0;au.play();btn.style.display='none';
    (function loop(){const t=au.currentTime;if(t>=DUR||au.ended){au.pause();btn.style.display='flex';btn.textContent='↻ REPLAY';render(DUR-.01);return}
      const look=t+.1,base=ac.currentTime-t;
      while(keyIdx<ks.length&&ks[keyIdx]<look){if(ks[keyIdx]>=t-.02)click(Math.max(ac.currentTime,base+ks[keyIdx]),.35);keyIdx++}
      while(bellIdx<bs.length&&bs[bellIdx]<look){if(bs[bellIdx]>=t-.02)bell(Math.max(ac.currentTime,base+bs[bellIdx]));bellIdx++}
      au.volume=1-inv(28.6,30,t);render(t);requestAnimationFrame(loop)})()};
});
</script>
